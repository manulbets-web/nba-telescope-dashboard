function notice(msg){let n=document.getElementById('notice');n.textContent=msg;n.style.display='block';setTimeout(()=>n.style.display='none',2000);}
function disclaimer(){const incomplete=H.find(d=>d.date===L.date);return `<div class="callout"><b>Interpretation:</b> All model EVs are research estimates based on supplied sportsbook quotes, not verified live fills. ${L.retro?'This featured snapshot is retrospective and should not be described as a prospective betting result. ':'The quotes have not been independently timestamp-verified. '}${incomplete?.graded&&incomplete.gradedFairLines<incomplete.totalFairLines?'This date has partial grading coverage ('+incomplete.gradedFairLines+' of '+incomplete.totalFairLines+' fair lines).':''} Correlated alternate lines do not represent independent observations.</div>`;}
function boardRows(){let rows=L.offers.filter(r=>r.book&&r.odds!==null);
 if(S.mode==='signals')rows=rows.filter(r=>r.watch);
 if(S.mode==='qualified')rows=rows.filter(r=>r.passesQC);
 if(S.filterMarket!=='ALL')rows=rows.filter(r=>r.market===S.filterMarket);
 if(S.filterGame!=='ALL')rows=rows.filter(r=>r.game===S.filterGame);
 if(S.search.trim()){const q=S.search.trim().toLowerCase();rows=rows.filter(r=>[r.player,r.market,r.book,gameLabel(r.game)].some(x=>String(x).toLowerCase().includes(q)));}
 rows=rows.filter(r=>(r.ev??-99)>=S.minEV);
 rows.sort((a,b)=>(b.ev??-99)-(a.ev??-99)||a.player.localeCompare(b.player)||a.market.localeCompare(b.market));return rows;
}
function rowMarket(r){return `<tr class="clickable" data-focus="${esc(r.player)}" data-combo="${r.market}">
<td><div class="player">${esc(r.player)}</div><div class="match">${esc(gameLabel(r.game))}</div></td><td>${tag(r.market,'soft')}</td>
<td class="nowrap"><span class="side ${r.side}">${r.side==='under'?'U':'O'} ${fmt(r.line,1)}</span></td>
<td><b>${odd(r.odds)}</b><div class="tiny">${esc(r.book)}</div></td>
<td class="num">${pct(r.pMarket)}</td><td class="num">${pct(r.pLoo)}</td><td class="num"><b>${pct(r.pConservative)}</b></td>
<td class="num ${mark(r.ev)}">${signedPct(r.ev)}</td>
<td>${r.watch?tag('WATCH','watch'):r.passesQC?tag('QC passed','qc'):tag('Exploratory','soft')}</td></tr>`;}
function renderBoard(){
 const nGames=Object.keys(L.games).length,nPlayers=L.players.length;
 const counts={signals:L.offers.filter(r=>r.watch).length,qualified:L.offers.filter(r=>r.passesQC).length,all:L.offers.length};
 const current=boardRows();const shown=current.slice(0,S.limit);
 let out=title('Current pricing snapshot',dates(L.date),`Market-implied reconstruction of player combo probabilities. ${L.retro?'Latest archived research slate':'Latest stored slate'} · ${esc(L.snapshot)}`,tag(L.retro?'Retrospective':'Snapshot saved',L.retro?'retro':'live'));
 out+=`<div class="cards">${stat(nGames,'Matchups','From imported odds file')}${stat(nPlayers,'Priced players','At least one combo priced')}${stat(fmt(L.pricedLines,0),'Fair combo lines','Distinct lines, across PR / PA / RA / PRA')}${stat(counts.signals,'Research signals','Predeclared 2% conservative EV gate')}</div>`;
 out+=disclaimer();
 out+=`<div class="sectiontop"><div><h2>Opportunity board</h2><p class="hint">Conservative EV is the minimum across dependence assumptions and two marginal-reconstruction methods. Click any row to inspect the player's composite ladder.</p></div><button class="pillbutton" id="exportBoard">Export displayed CSV ↓</button></div>`;
 out+=`<div class="panel"><div class="controlrow"><div class="seg" id="modeButtons">${[['signals','Research watchlist'],['qualified','QC passed'],['all','All offers']].map(([v,t])=>`<button data-mode="${v}" class="${S.mode===v?'active':''}">${t} <span class="tiny">${counts[v].toLocaleString()}</span></button>`).join('')}</div>
<input class="search" id="boardSearch" placeholder="Search player, book, or team…" value="${esc(S.search)}" aria-label="Search board">
<select id="boardMarket" aria-label="Filter combination"><option value="ALL">All combos</option>${Object.keys(LAB).map(m=>`<option ${S.filterMarket===m?'selected':''}>${m}</option>`).join('')}</select>
<select id="boardGame" aria-label="Filter matchup"><option value="ALL">All games</option>${Object.entries(L.games).sort((a,b)=>a[1].label.localeCompare(b[1].label)).map(([id,g])=>`<option value="${esc(id)}" ${S.filterGame===id?'selected':''}>${esc(g.label)}</option>`).join('')}</select>
<select id="boardEv" aria-label="Minimum robust EV">${[0,.01,.02,.03,.05,.08,.10].map(v=>`<option value="${v}" ${S.minEV===v?'selected':''}>EV ≥ ${(100*v).toFixed(0)}%</option>`).join('')}</select></div>
<div class="tablewrap">${current.length?`<table class="tbl"><thead><tr><th>Player / game</th><th>Combo</th><th>Line / side</th><th>Best quote</th><th class="num">Book no-vig</th><th class="num">Model LOO</th><th class="num">Conservative</th><th class="num">Robust EV</th><th>Flag</th></tr></thead><tbody>${shown.map(rowMarket).join('')}</tbody></table>`:`<div class="emptystate"><strong>No matching offers</strong>${S.mode==='signals'?'The model produced no signals meeting the predeclared rules, or your filters removed them. Try “QC passed” to inspect near misses.':'Adjust the filters to see additional prices.'}</div>`}</div>
<div class="footerline"><span>Showing ${shown.length.toLocaleString()} of ${current.length.toLocaleString()} offers · Best available quoted book per line/side · Not verified live</span>${shown.length<current.length?'<button class="showmore" id="boardMore">Show 100 more</button>':'<span>All matches displayed</span>'}</div></div>`;
 out+=`<div class="section twoequal"><div class="panel panelpad"><h3>What counts as a research signal?</h3><p class="notebox">A candidate must have at least 3 independent consensus combo books, sufficient two-sided P/R/A rungs, a usable target-excluded dependence fit, and at least 2% conservative EV across both marginal-building methods. Only one offer is selected per player and combo. These are not placed wagers.</p></div>
<div class="panel panelpad"><h3>Pricing market vs betting execution</h3><p class="notebox">The combination's de-vigged sportsbook consensus is a diagnostic benchmark. Estimated betting EV uses the best actual quoted American price in the imported file. That book/quote may be unavailable at publication time.</p></div></div>`;
 document.getElementById('main').innerHTML=out;
 document.getElementById('modeButtons').onclick=e=>{let b=e.target.closest('[data-mode]');if(b){S.mode=b.dataset.mode;S.limit=80;renderBoard();}};
 document.getElementById('boardSearch').oninput=e=>{let a=e.target.selectionStart;S.search=e.target.value;renderBoard();let f=document.getElementById('boardSearch');f.focus();f.setSelectionRange(a,a);};
 document.getElementById('boardMarket').onchange=e=>{S.filterMarket=e.target.value;S.limit=80;renderBoard();};
 document.getElementById('boardGame').onchange=e=>{S.filterGame=e.target.value;S.limit=80;renderBoard();};
 document.getElementById('boardEv').onchange=e=>{S.minEV=+e.target.value;S.limit=80;renderBoard();};
 document.getElementById('exportBoard').onclick=()=>outCSV(current,`nba_telescope_${L.date}_${S.mode}.csv`);
 if(document.getElementById('boardMore'))document.getElementById('boardMore').onclick=()=>{S.limit+=100;renderBoard();};
 document.querySelectorAll('[data-focus]').forEach(tr=>tr.onclick=()=>{S.player=tr.dataset.focus;S.combo=tr.dataset.combo;setTab('player');});
}
function svgLadder(fair){
 if(!fair.length)return '<div class="emptystate"><strong>No lines available</strong></div>';
 const vals=fair.slice().sort((a,b)=>a.line-b.line);const W=770,H=306,left=51,right=22,top=18,bottom=40,plotW=W-left-right,plotH=H-top-bottom;
 let lo=Math.min(...vals.map(v=>v.line)),hi=Math.max(...vals.map(v=>v.line));if(lo===hi){lo-=1;hi+=1;}
 const xx=v=>left+(v-lo)/(hi-lo)*plotW,yy=v=>top+(1-v)*plotH;
 let svg=`<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="Probability over by combo line, model versus market">`;
 for(let y=0;y<=1.0001;y+=.25){svg+=`<line x1="${left}" x2="${W-right}" y1="${yy(y)}" y2="${yy(y)}" stroke="#e3ebf0" stroke-width="1"/><text x="${left-12}" y="${yy(y)+4}" text-anchor="end" fill="#7890a2" font-size="11">${Math.round(y*100)}%</text>`;}
 const ticks=vals.length>10?vals.filter((r,i)=>i%Math.ceil(vals.length/8)===0):vals;
 for(const v of ticks)svg+=`<text x="${xx(v.line)}" y="${H-14}" text-anchor="middle" font-size="11" fill="#738598">${fmt(v.line)}</text>`;
 svg+=`<line x1="${left}" x2="${W-right}" y1="${yy(.5)}" y2="${yy(.5)}" stroke="#889cac" stroke-dasharray="4 6"/>`;
 const lines=[['indicativeOver','#bbbec8',1.4],['marketOver','#8d9bad',2.3],['ind','#c69b55',1.7],['loo','#00897c',3.4]];
 for(const [key,color,stroke] of lines){let points=vals.filter(v=>v[key]!=null).map(v=>[xx(v.line),yy(v[key])]);if(points.length<1)continue;if(points.length>1)svg+=`<polyline fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round" stroke-width="${stroke}" points="${points.map(p=>p.join(',')).join(' ')}"/>`;
 for(const [x,y] of points)svg+=`<circle cx="${x}" cy="${y}" r="${key==='loo'?3.7:2.5}" fill="${color}" stroke="#fff" stroke-width="1.3"/>`;
 }
 svg+=`<text x="${left}" y="${H-2}" font-size="10" fill="#7990a1">Combo line</text></svg>`;
 return svg+`<div class="legend"><span><i class="dot" style="background:#8d9bad"></i>Two-sided no-vig</span><span><i class="dot" style="background:#bbbec8"></i>One-sided indicative (not no-vig)</span><span><i class="dot" style="background:#00897c"></i>Market LOO</span><span><i class="dot" style="background:#c69b55"></i>Independence</span></div>`;
}
function svgMarginal(stat){
 const game=(L.fair.find(r=>r.player===S.player)||{}).game;
 const data=L.marginals?.[String(game)+'||'+S.player]?.[stat];
 if(!data)return '<div class="emptystate">No reconstructed constituent distribution available.</div>';
 const vals=data.model, obs=data.observed;
 if(!vals.length)return '<div class="emptystate">No modeled probabilities.</div>';
 const W=500,H=230,l=42,r=18,t=14,b=35,pw=W-l-r,ph=H-t-b;
 const hi=Math.max(...vals.map(x=>x.line),...obs.map(x=>x.line));
 const xx=v=>l+(v/Math.max(hi,1))*pw, yy=v=>t+(1-v)*ph;
 let svg=`<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${stat} market-implied probability of over by stat line">`;
 for(let y=0;y<=1.001;y+=.25)svg+=`<line x1="${l}" x2="${W-r}" y1="${yy(y)}" y2="${yy(y)}" stroke="#e3ebf0"/><text x="${l-7}" y="${yy(y)+4}" text-anchor="end" font-size="10" fill="#738598">${Math.round(y*100)}%</text>`;
 const pts=vals.map(v=>`${xx(v.line)},${yy(v.over)}`).join(' ');
 svg+=`<polyline points="${pts}" fill="none" stroke="#00897c" stroke-width="2.8"/>`;
 for(const v of obs){const color=v.source==='two_sided'?'#3269bd':'#c69b55';svg+=`<circle cx="${xx(v.line)}" cy="${yy(v.over)}" r="3.5" fill="${color}" stroke="white" stroke-width=".8"/>`;}
 for(let i=0;i<=4;i++){let x=hi*i/4;svg+=`<text x="${xx(x)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#738598">${fmt(x,0)}</text>`;}
 return svg+'</svg>';
}
function renderConstituents(){
 const game=(L.fair.find(r=>r.player===S.player)||{}).game;
 const m=L.marginals?.[String(game)+'||'+S.player]||{};
 return `<div class="section"><div class="sectiontop"><div><h2>Constituent market-implied distributions</h2><p class="hint">Reconstructed from bookmaker points, rebounds and assists ladders. These are <b>not</b> independent player forecasts. Each curve is P(over) by stat line; points mark actual quoted rungs.</p></div></div><div class="constituentgrid">${[['P','Points'],['R','Rebounds'],['A','Assists']].map(([k,label])=>{let d=m[k];return `<div class="panel panelpad"><h3>${label}</h3>${d?`<div class="tiny">Market-implied mean ${fmt(d.mean,1)} · SD ${fmt(d.sd,1)} · ${d.twoSided} paired / ${d.oneSided} single-side rungs</div>`:''}<div class="svgcard" style="margin-top:12px">${svgMarginal(k)}</div><div class="legend"><span><i class="dot" style="background:#00897c"></i>Reconstructed</span><span><i class="dot" style="background:#3269bd"></i>Paired no-vig</span><span><i class="dot" style="background:#c69b55"></i>Single-side adjusted</span></div></div>`}).join('')}</div></div>`;
}
function renderPlayer(){let combos=[...new Set(L.fair.filter(r=>r.player===S.player).map(r=>r.market))];if(!combos.includes(S.combo))S.combo=combos[0]||'PRA';
 const all=L.fair.filter(r=>r.player===S.player&&r.market===S.combo).sort((a,b)=>a.line-b.line);
 const game=all.length?all[0].game:'';const crosses=L.midpoints.find(r=>r.game===game&&r.player===S.player&&r.market===S.combo)||{};
 const relevant=L.offers.filter(r=>r.player===S.player&&r.market===S.combo);
 const associated=l=>relevant.filter(r=>r.line===l);
 let out=title('Composite price exploration','Player explorer','Compare the bookmaker’s no-vig combo survival ladder to our independently reconstructed joint-distribution probabilities.');
 out+=`<div class="panel"><div class="controlrow"><label class="tiny"><b>Player</b></label><select id="playerSel" style="min-width:230px">${L.players.map(p=>`<option ${S.player===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label class="tiny"><b>Combination</b></label><div class="seg" id="comboSeg">${combos.map(m=>`<button data-combo-pick="${m}" class="${S.combo===m?'active':''}">${m}</button>`).join('')}</div><span class="emptychip">${esc(gameLabel(game))}</span></div>
<div class="panelpad"><div class="sectiontop"><div><h2>${esc(S.player)} · ${esc(LAB[S.combo]||S.combo)}</h2><p class="hint">All observed sportsbook half-point rungs, including over-only alternates. Model prices derive from P/R/A markets; single-sided combo quotes are indicative only.</p></div>${tag(`${all.length} lines`,'soft')}</div>
<div class="two"><div class="svgcard">${svgLadder(all)}</div><div><div class="feature"><div class="eyebrow" style="color:#93d4cc">Approximate fair-line comparison</div><div class="metric">${crosses.modelMid!=null?fmt(crosses.modelMid,2):'Not bracketed'}</div><p>Model-implied 50% over-probability crossing, interpolated within observed combo rungs.</p></div>
<div class="modelbox" style="grid-template-columns:repeat(2,1fr)"><div class="minibox"><div class="label">Market 50% crossing</div><div class="figure">${fmt(crosses.marketMid,2)}</div></div><div class="minibox"><div class="label">Model minus market</div><div class="figure ${crosses.gap!=null?mark(crosses.gap):''}">${signedNum(crosses.gap,2)}</div></div></div><p class="notebox" style="margin-top:16px">Only lines with a two-sided consensus determine the market 50% crossing; one-sided adjusted quotes never serve as the no-vig benchmark. The 50% crossing is only shown when observed lines bracket 50%; it is not a statistical projection of future box-score performance. Target combo odds are excluded from the market-LOO dependence fit.</p></div></div></div></div>`;
 out+=renderConstituents();
 out+=`<div class="section"><div class="sectiontop"><div><h2>Full composite ladder</h2><p class="hint">Every observed standard and alternate line. A dash in two-sided P(O) means no valid paired book quote; the indicative single-side probability is not a de-vigged consensus.</p></div><button class="pillbutton" id="exportLadder">Export CSV ↓</button></div><div class="panel tablewrap">${all.length?`<table class="tbl"><thead><tr><th>Combo line</th><th class="num">Book two-sided P(O)</th><th class="num">Indicative single-side P(O)</th><th class="num">Independent</th><th class="num">Weak +</th><th class="num">Moderate +</th><th class="num">Market LOO</th><th class="num">Range</th><th>Best over</th><th>Best under</th><th class="num">Quoting books</th></tr></thead><tbody>${all.map(r=>{let o=associated(r.line).find(a=>a.side==='over'),u=associated(r.line).find(a=>a.side==='under');return `<tr><td><b>${S.combo} ${fmt(r.line)}</b></td><td class="num">${pct(r.marketOver)}</td><td class="num">${pct(r.indicativeOver)}</td><td class="num">${pct(r.ind)}</td><td class="num">${pct(r.weak)}</td><td class="num">${pct(r.moderate)}</td><td class="num"><b>${pct(r.loo)}</b></td><td class="num tiny">${pct(r.low)}–${pct(r.high)}</td><td class="nowrap">${o?`${odd(o.odds)} <span class="tiny">${esc(o.book)}</span>`:'—'}</td><td class="nowrap">${u?`${odd(u.odds)} <span class="tiny">${esc(u.book)}</span>`:'—'}</td><td class="num">${r.quotedBooks||r.books}</td></tr>`;}).join('')}</tbody></table>`:`<div class="emptystate">No combo lines for this player.</div>`}</div></div>`;
 out+=`<div class="section"><div class="panel panelpad"><h3>How to interpret this player</h3><div class="modelbox"><div class="minibox"><div class="label">Dependence fit</div><div class="figure">${all.length?fmt(all[0].fitRMSE,3):'—'}</div><p class="tiny">Other-combo probability RMSE</p></div><div class="minibox"><div class="label">P/R implied ρ</div><div class="figure">${all.length?fmt(all[0].rhoPR,2):'—'}</div></div><div class="minibox"><div class="label">P/A implied ρ</div><div class="figure">${all.length?fmt(all[0].rhoPA,2):'—'}</div></div><div class="minibox"><div class="label">R/A implied ρ</div><div class="figure">${all.length?fmt(all[0].rhoRA,2):'—'}</div></div></div><p class="notebox" style="margin-top:12px">Correlations are approximate fitted dependence parameters, not historical player correlations; some estimates can be weakly identified from limited other-combo ladders.</p></div></div>`;
 document.getElementById('main').innerHTML=out;
 document.getElementById('playerSel').onchange=e=>{S.player=e.target.value;renderPlayer();};
 document.getElementById('comboSeg').onclick=e=>{let b=e.target.closest('[data-combo-pick]');if(b){S.combo=b.dataset.comboPick;renderPlayer();}};
 if(document.getElementById('exportLadder'))document.getElementById('exportLadder').onclick=()=>outCSV(all,`nba_${L.date}_${S.player.replaceAll(' ','_')}_${S.combo}.csv`);
}
function barScore(rows){if(!rows.length)return '<div class="emptystate">No calibration observations.</div>';const max=Math.max(...rows.map(r=>r.brier||0),.001);
 return `<div class="bargraph">${rows.map(r=>`<div class="barrow ${r.model==='market_loo'?'selected':''}"><span>${esc(MODEL[r.model]||r.model)}</span><div class="bartrack"><i style="width:${Math.min(100,(r.brier||0)/max*100)}%"></i></div><strong class="num">${fmt(r.brier,4)}</strong></div>`).join('')}</div><p class="tiny">Lower Brier score is better. Alternate lines and same-player markets are correlated; differences are descriptive.</p>`;
}
function svgReliability(rows){const W=490,H=300,Lft=52,R=20,T=18,B=43, pw=W-Lft-R,ph=H-T-B;
 const xx=x=>Lft+x*pw,yy=y=>T+(1-y)*ph;
 let svg=`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted vs observed reliability chart">`;
 for(let v=0;v<=1.001;v+=.2){svg+=`<line x1="${xx(0)}" y1="${yy(v)}" x2="${xx(1)}" y2="${yy(v)}" stroke="#e8eef3"/><line x1="${xx(v)}" y1="${yy(0)}" x2="${xx(v)}" y2="${yy(1)}" stroke="#e8eef3"/><text x="${Lft-12}" y="${yy(v)+4}" text-anchor="end" fill="#8092a4" font-size="11">${Math.round(v*100)}%</text><text x="${xx(v)}" y="${H-18}" text-anchor="middle" fill="#8092a4" font-size="11">${Math.round(v*100)}%</text>`;}
 svg+=`<line x1="${xx(0)}" y1="${yy(0)}" x2="${xx(1)}" y2="${yy(1)}" stroke="#b1bfcd" stroke-width="1.5" stroke-dasharray="6 5"/>`;
 for(const r of rows){const radius=Math.max(3,Math.min(12,Math.sqrt(r.n)*.65));svg+=`<circle cx="${xx(r.p)}" cy="${yy(r.actual)}" r="${radius}" fill="#008e81" fill-opacity=".78" stroke="white" stroke-width="1"><title>${r.n} lines, predicted ${pct(r.p)}, observed ${pct(r.actual)}</title></circle>`;}
 svg+=`<text x="${W/2}" y="${H-1}" text-anchor="middle" font-size="11" fill="#526b80">Mean predicted P(over)</text><text x="12" y="${H/2}" text-anchor="middle" font-size="11" fill="#526b80" transform="rotate(-90 12 ${H/2})">Observed over rate</text></svg>`;
 return svg;
}
function renderPerf(){const P=DATA.performance[S.perf], eligible=H.filter(d=>d.graded && (S.perf==='all'||d.retro===(S.perf==='retrospective'))),n=eligible.length;
 let out=title('Historical model audit','Track record','All results come from frozen, dated model outputs. Research reconstructions and pregame snapshots are clearly separated.');
 out+=`<div class="seg" id="cohortButtons" style="margin:0 0 17px">${[['all','All graded'],['prospective','New-run snapshots'],['retrospective','Retrospective research']].map(([v,t])=>`<button data-cohort="${v}" class="${S.perf===v?'active':''}">${t}</button>`).join('')}</div>`;
 out+=`<div class="cards">${stat(n,'Graded slates','Unique date snapshots')}${stat(fmt(P.gradedLines,0),'Graded fair lines','Correlated observations')}${stat(`${P.signalWins} / ${P.gradedSignals}`,'Research-signal wins','At best quoted prices, unfilled')}${stat(signedNum(P.signalUnits,2)+'u','Shadow net return','Flat 1-unit, not executed')}</div>`;
 out+=`<div class="callout"><b>Performance context:</b> ${S.perf==='all'&&eligible.some(d=>d.retro)?'Includes retrospectively reconstructed pricing runs. ':''}These are shadow selections unless separately recorded as placed bets. Historical line-level calibration is not based on independent observations, and minimum-EV sweeps are exploratory until thresholds are validated on later dates.</div>`;
 if(!P.days){out+=`<div class="panel emptystate"><strong>No graded data in this cohort</strong>Run a new pregame snapshot, then grade it using hoopR to start a dedicated forward-test record.</div>`;document.getElementById('main').innerHTML=out;document.getElementById('cohortButtons').onclick=changeCohort;return;}
 let overall=P.calibration.filter(r=>r.market==='ALL');
 out+=`<div class="section two"><div class="panel panelpad"><h2>Distribution calibration</h2><p class="hint">Brier score · sportsbook consensus vs reconstructed combination distributions</p>${barScore(overall)}</div><div class="panel panelpad"><h2>Reliability by probability bucket</h2><p class="hint">Market LOO · bubble size indicates graded lines</p>${svgReliability(P.reliability.filter(r=>r.model==='market_loo'))}</div></div>`;
 out+=`<div class="section"><div class="sectiontop"><div><h2>EV threshold laboratory</h2><p class="hint">Predefined thresholds applied across every available graded date; deduplication happens before evaluating outcomes.</p></div><select id="policySel" class="selectbox"><option value="one_per_player_combo" ${S.policy==='one_per_player_combo'?'selected':''}>One per player + combo</option><option value="one_per_player" ${S.policy==='one_per_player'?'selected':''}>One per player</option></select></div>
<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Minimum conservative EV</th><th class="num">Selections</th><th class="num">Graded</th><th class="num">W–L</th><th class="num">Flat 1u net</th><th class="num">Flat ROI</th><th class="num">To-win 1u net</th><th class="num">To-win ROI</th><th>Sample note</th></tr></thead><tbody>${P.thresholds.filter(t=>t.policy===S.policy).map(t=>`<tr><td><b>${pct(t.min_conservative_EV,0)}</b></td><td class="num">${fmt(t.signals_all,0)}</td><td class="num">${fmt(t.graded,0)}</td><td class="num">${t.wins||0}–${t.losses||0}</td><td class="num ${mark(t.units_flat_1)}">${signedNum(t.units_flat_1,2)}</td><td class="num ${mark(t.roi_flat_1)}">${signedPct(t.roi_flat_1)}</td><td class="num ${mark(t.units_to_win_1)}">${signedNum(t.units_to_win_1,2)}</td><td class="num ${mark(t.roi_to_win_1)}">${signedPct(t.roi_to_win_1)}</td><td>${t.graded<20?tag('Small sample','retro'):tag('Exploratory','soft')}</td></tr>`).join('')}</tbody></table></div></div>`;
 const calib=P.calibration;
 out+=`<div class="section"><h2>Performance by combination type</h2><p class="hint" style="margin-bottom:13px">Compare the market to independence and market-implied dependence for each composite.</p><div class="panel tablewrap"><table class="tbl"><thead><tr><th>Market</th><th class="num">Lines</th><th class="num">Book Brier</th><th class="num">Independent Brier</th><th class="num">Market LOO Brier</th><th class="num">Book log loss</th><th class="num">LOO log loss</th></tr></thead><tbody>${['PR','PA','RA','PRA'].map(m=>{let r=model=>calib.find(x=>x.market===m&&x.model===model);let b=r('market_consensus'),i=r('independence'),l=r('market_loo');return `<tr><td>${tag(m,'soft')}</td><td class="num">${fmt(b?.n,0)}</td><td class="num">${fmt(b?.brier,4)}</td><td class="num">${fmt(i?.brier,4)}</td><td class="num"><b>${fmt(l?.brier,4)}</b></td><td class="num">${fmt(b?.logloss,4)}</td><td class="num">${fmt(l?.logloss,4)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
 out+=`<div class="section twoequal"><div class="panel"><div class="panelpad"><h2>Frozen signals · actual outcomes</h2><p class="hint">Only the selected research shortlist, not all the quotes in the model.</p></div><div class="tablewrap scroll-y"><table class="tbl"><thead><tr><th>Date / player</th><th>Market</th><th>Price</th><th class="num">Est. EV</th><th>Outcome</th><th class="num">Shadow P/L</th></tr></thead><tbody>${P.signalsHistory.map(r=>`<tr><td><b>${esc(r.player)}</b><div class="tiny">${esc(dateShort(r.date))}</div></td><td>${r.side==='under'?'U':'O'} ${fmt(r.line)} ${tag(r.market,'soft')}</td><td>${odd(r.odds)}<div class="tiny">${esc(r.book)}</div></td><td class="num">${pct(r.ev)}</td><td>${esc(r.result||'Unresolved')} ${r.actual!=null?`<div class="tiny">Actual ${fmt(r.actual,0)}</div>`:''}</td><td class="num ${mark(r.profit)}">${signedNum(r.profit,2)}</td></tr>`).join('')||'<tr><td colspan="6">No research signals</td></tr>'}</tbody></table></div></div>
<div class="panel"><div class="panelpad"><h2>Verified placed-bet log</h2><p class="hint">Distinct from shadow returns. Bets must be explicitly recorded with their actual execution details.</p><div class="modelbox" style="grid-template-columns:repeat(2,1fr)"><div class="minibox"><div class="label">Confirmed</div><div class="figure">${P.placed}</div></div><div class="minibox"><div class="label">Graded profit</div><div class="figure">${signedNum(P.placedUnits,2)}u</div></div></div>${DATA.publicShare?'<p class="notebox" style="margin-top:19px">For privacy, this public dashboard shows aggregate confirmed-bet totals but does not disclose individual wager details.</p>':!P.placed?'<p class="notebox" style="margin-top:19px">No confirmed placed wagers have been entered. The model watchlist is not a bet-placement record.</p>':`<div class="tablewrap"><table class="tbl"><thead><tr><th>Date / player</th><th>Market</th><th>Result</th><th class="num">Net units</th></tr></thead><tbody>${P.placedHistory.map(r=>`<tr><td>${esc(r.player)}<div class="tiny">${esc(r.date)}</div></td><td>${r.side==='under'?'U':'O'} ${fmt(r.line)} ${r.market}</td><td>${esc(r.result)}</td><td class="num">${signedNum(r.profit,2)}</td></tr>`).join('')}</tbody></table></div>`}</div></div></div>`;
 out+=`<div class="section"><h2>History and coverage</h2><div class="panel tablewrap"><table class="tbl"><thead><tr><th>Slate</th><th>Snapshot</th><th>Capture type</th><th class="num">Graded fair lines</th><th class="num">All fair lines</th><th class="num">Graded shadow offers</th><th>State</th></tr></thead><tbody>${H.map(d=>`<tr><td><b>${esc(d.date)}</b></td><td class="tiny">${esc(d.snapshot)}</td><td>${d.retro?tag('Retrospective','retro'):tag('New-run snapshot','live')}</td><td class="num">${fmt(d.gradedFairLines,0)}</td><td class="num">${fmt(d.totalFairLines,0)}</td><td class="num">${fmt(d.gradedOffers,0)}</td><td>${d.graded?tag(d.gradedFairLines<d.totalFairLines?'Partially graded':'Graded',d.gradedFairLines<d.totalFairLines?'retro':'watch'):tag('Awaiting grading','soft')}</td></tr>`).join('')}</tbody></table></div></div>`;
 document.getElementById('main').innerHTML=out;
 document.getElementById('cohortButtons').onclick=changeCohort;

function renderMethod(){
 let out=title('Methodology and controls','How Telescope prices a combo','The core hypothesis: individual-stat sportsbook markets are reasonably efficient, but combination markets can occasionally disagree with the implied constituent distributions.');
 out+=`<div class="two"><div class="panel panelpad"><h2>Pricing architecture</h2><div class="simplelist">${[
 ['Collect sportsbook ladders','Import P/R/A and PR/PA/RA/PRA lines from multiple books, keeping original quoted odds and alternate rungs.'],
 ['Construct marginal probabilities','De-vig paired over/under markets; fill otherwise missing rungs using explicitly flagged one-sided estimates; enforce monotonicity and fitted distribution tails.'],
 ['Solve for a joint distribution','Compare independence and weak/moderate dependence with an approximate dependence fit from other combo markets. The combination being evaluated is always excluded from the fit.'],
 ['Price each observed combo rung','Calculate probabilities and fair prices for each combo line, then compare to the sportsbook consensus and the best offered quote.'],
 ['Stress test before selecting','A signal must pass feed coverage / fit-quality QC and remain positive after both marginal-reconstruction methods and dependence scenarios.'],
 ['Freeze, grade and validate','The full slate, model code, signals and odds are frozen per run. hoopR box scores are used later, with confirmed placed bets logged independently.']
 ].map((x,i)=>`<div class="methodstep"><div class="stepnum">${i+1}</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div></div><div><div class="panel panelpad"><h2>What Telescope does not do</h2><p class="notebox">No player projections. No player archetypes, opponent defense features, team strength forecasting, playing-time predictions, or lineup-based adjustments. The bookmakers’ P/R/A probabilities are treated as the information source, not as a feature in a separate prediction model.</p><div class="modelbox" style="grid-template-columns:repeat(2,1fr)"><div class="minibox"><div class="label">Primary signal threshold</div><div class="figure">2%</div></div><div class="minibox"><div class="label">Max research selection</div><div class="figure">1</div><p class="tiny">Per player + combo</p></div></div></div><div class="panel panelpad section"><h2>Audit warnings</h2><p class="notebox">Market-implied correlations are approximate and may be weakly identified. The source CSV may not prove the time quotes were available. “Best book” is historical in-file pricing, not a real-time execution guarantee. A retrospective reconstruction cannot be treated as a prospective backtest. An EV threshold must be fixed on prior slates before measuring future profitability.</p></div><div class="panel panelpad section"><h2>Sharing and privacy</h2><p class="notebox">This website is a standalone generated HTML file. It embeds market-derived probabilities, quoted bookmaker offers, grading summaries and model-generated watchlists. Individual confirmed-wager details are omitted from public exports; private exports can display them. It does <b>not</b> publish raw odds CSVs, authentication keys, or private account identifiers. Review the placed-bet section before public hosting, as entered wager details are deliberately visible to partners.</p></div></div></div>`;
 document.getElementById('main').innerHTML=out;
}
